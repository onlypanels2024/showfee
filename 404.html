<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// Short booking links: showfee.app/book/<name>  →  showfee.app/book/?u=<name>
(function () {
  var m = location.pathname.match(/^\/book\/([A-Za-z0-9-]{2,31})\/?$/);
  if (m) location.replace('/book/?u=' + m[1].toLowerCase());
})();
</script>
<link rel="icon" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<title>Page not found – ShowFee</title>
<meta name="robots" content="noindex">
</head><body>
<main style="min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center">
  <div>
    <img src="/assets/logo-180.png" alt="ShowFee" style="width:84px;height:84px;margin:0 auto 18px;border-radius:20px">
    <h1 style="margin:0 0 8px;font-size:28px">Page not found</h1>
    <p style="color:var(--muted);margin:0 0 22px">The link may be wrong or the page has moved.</p>
    <a class="btn" href="/">Go to ShowFee</a>
  </div>
</main>
</body></html>
